---
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Verify version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Home Assistant app manifest in JustBeanie/ha-addons selects the
      # image tag by its own `version:`. A tag that disagrees with
      # package.json would publish an image nothing can reference, so refuse
      # to build rather than leave that trap behind.
      - name: Check the tag matches package.json
        id: check
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          test -n "${version}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  publish:
    name: Publish ${{ matrix.arch }} image
    needs: version
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            platform: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.platform }}
          push: true
          provenance: false
          tags: |
            ghcr.io/justbeanie/bacnet-mqtt-gateway-${{ matrix.arch }}:${{ needs.version.outputs.version }}
            ghcr.io/justbeanie/bacnet-mqtt-gateway-${{ matrix.arch }}:latest
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ needs.version.outputs.version }}
